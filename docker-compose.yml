services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photoai}
      POSTGRES_USER: ${POSTGRES_USER:-photoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-photoai} -d $${POSTGRES_DB:-photoai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-photoai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-photoai}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      A1111_BASE_URL: ${A1111_BASE_URL:-http://host.docker.internal:7860}
      A1111_TIMEOUT_SECONDS: "600"
      A1111_OFFLOAD_BEFORE_JOB: "true"
      STORAGE_PATH: /storage
      LOG_LEVEL: INFO
      MAX_UPLOAD_BYTES: "12582912"
      MAX_IMAGE_PIXELS: "16000000"
      OUTPAINT_MAX_PIXELS: "786432"
      RESTORE_MAX_PIXELS: "1048576"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./storage:/storage
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://photo-be.suprenam.id.vn}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-18888}
    command: sh -c "npx next start -H 0.0.0.0 -p $${FRONTEND_PORT:-18888}"
    ports:
      - "${FRONTEND_PORT:-18888}:${FRONTEND_PORT:-18888}"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:${FRONTEND_PORT:-18888}/api/health 2>/dev/null || wget -qO- http://127.0.0.1:${FRONTEND_PORT:-18888}/ 2>/dev/null | head -c 1"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  db-data:
