services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: photoai
      POSTGRES_USER: photoai
      POSTGRES_PASSWORD: photoai123
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoai -d photoai"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://photoai:photoai123@db:5432/photoai
      SECRET_KEY: dev-secret-key-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      A1111_BASE_URL: ${A1111_BASE_URL:-http://host.docker.internal:7860}
      A1111_TIMEOUT_SECONDS: "600"
      A1111_OFFLOAD_BEFORE_JOB: "true"
      STORAGE_PATH: /storage
      LOG_LEVEL: INFO
      MAX_UPLOAD_BYTES: "12582912"
      MAX_IMAGE_PIXELS: "16000000"
      OUTPAINT_MAX_PIXELS: "786432"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./storage:/storage
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://photo-be.suprenam.id.vn
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-18888}
    command: sh -c "npx next start -H 0.0.0.0 -p $${FRONTEND_PORT:-18888}"
    ports:
      - "${FRONTEND_PORT:-18888}:${FRONTEND_PORT:-18888}"

volumes:
  db-data:
