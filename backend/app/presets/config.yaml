presets:
  txt2img:
    realistic:
      model: realismIllustriousBy_v55FP16
      steps: 30
      cfg_scale: 7
      sampler_name: DPM++ 2M Karras
      width: 768
      height: 1024
      # realismIllustriousBy v55: SD 1.5 photorealism model. RAW photo + natural skin texture key triggers.
      # Structure: quality → medium → lighting → details (stable-diffusion-art.com/prompt-guide)
      base_positive: "(masterpiece, best quality:1.2), RAW photo, photorealistic, ultra-detailed, natural skin texture, realistic eyes, sharp focus, cinematic lighting, depth of field"
      base_negative: "(worst quality, low quality:1.4), nsfw, bad anatomy, bad hands, extra fingers, missing fingers, text, signature, watermark, blurry, deformed, jpeg artifacts, cropped, duplicate, ugly"

    anime:
      model: anything-v5
      steps: 20
      cfg_scale: 7
      sampler_name: DPM++ 2M Karras
      width: 512
      height: 768
      # anything-v5 + animeoutlineV4_16 LoRA (civitai #16014). Trigger words: lineart, monochrome.
      # Author rec: steps=20, cfg=7, DPM++ 2M Karras, LoRA strength=1.
      base_positive: "<lora:animeoutlineV4_16:1>, lineart, monochrome, (masterpiece, best quality:1.2), manga style, highly detailed, clean lines, intricate details"
      base_negative: "(worst quality, low quality, normal quality:1.3), nsfw, bad anatomy, bad hands, extra fingers, text, watermark, blurry, realistic, 3d render, ugly, duplicate, color, grainy"

    advertisement:
      model: Juggernaut-XL_v9_RunDiffusionPhoto_v2
      steps: 30
      cfg_scale: 7
      sampler_name: DPM++ 2M Karras
      width: 1024
      height: 1024
      # Juggernaut XL v9: SDXL model. Less quality-tag reliance (SDXL trained for quality by default).
      # Focus on descriptive commercial photography language. Weighted negative more effective on SDXL.
      base_positive: "commercial photography, product shot, professional studio lighting, clean background, sharp focus, highly detailed, photorealistic, 8k, crisp edges, advertisement quality"
      base_negative: "(worst quality, low quality:2), nsfw, amateur, blurry, grainy, noise, distortion, overexposed, underexposed, text, watermark, cartoon, painting, illustration, deformed"

    portrait:
      model: realismIllustriousBy_v55FP16
      steps: 30
      cfg_scale: 7
      sampler_name: DPM++ 2M Karras
      width: 512
      height: 768
      # Close-up portrait — shallow DoF, catchlights, soft rim light key for portrait realism.
      base_positive: "(masterpiece, best quality:1.2), RAW photo, photorealistic, portrait, beautiful face, natural skin texture, detailed eyes with catchlights, soft rim lighting, shallow depth of field, sharp focus"
      base_negative: "(worst quality, low quality:1.4), nsfw, bad anatomy, bad hands, extra fingers, text, signature, watermark, blurry, cartoon, anime, painting, deformed, ugly, duplicate"

    artistic:
      model: v1-5-pruned-emaonly
      steps: 30
      cfg_scale: 7.5
      sampler_name: DPM++ 2M Karras
      width: 768
      height: 768
      # SD 1.5 base: versatile illustration/concept art. Artstation + digital painting steer toward polished art.
      # Slightly higher CFG (7.5) for stronger stylistic adherence.
      base_positive: "(masterpiece, best quality:1.2), highly detailed, digital painting, trending on artstation, concept art, smooth brushwork, sharp focus, vivid colors, illustration, dynamic lighting"
      base_negative: "(worst quality, low quality:1.4), nsfw, bad anatomy, bad hands, extra fingers, text, watermark, blurry, ugly, duplicate, deformed, grainy, poorly drawn face, poorly drawn hands"

    natural:
      model: chilloutmix_NiPrunedFp32Fix
      steps: 25
      cfg_scale: 7
      sampler_name: DPM++ 2M Karras
      width: 512
      height: 768
      # ChilloutMix: SD 1.5 photo-realistic Asian portrait model. Sweet spot 24-28 steps per community.
      # Natural skin, golden hour lighting and bokeh are strong triggers for this model.
      base_positive: "(masterpiece, best quality:1.2), photorealistic, natural skin texture, soft golden hour lighting, detailed eyes, sharp focus, bokeh, depth of field, upper body, high resolution"
      base_negative: "(worst quality, low quality:1.4), nsfw, bad anatomy, bad hands, extra fingers, cloned face, text, signature, watermark, blurry, deformed, cartoon, anime, jpeg artifacts, cropped"

    sketch:
      model: v1-5-pruned-emaonly
      steps: 30
      cfg_scale: 7.5
      sampler_name: DPM++ 2M Karras
      width: 768
      height: 768
      base_positive: "(masterpiece, best quality:1.2), pencil sketch, charcoal drawing, black and white, fine line art, detailed crosshatching, artist sketchbook, hand-drawn"
      base_negative: "(worst quality, low quality:1.4), nsfw, color, painted, photograph, realistic, 3d render, blurry, ugly, duplicate"

    vintage:
