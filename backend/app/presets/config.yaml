# Model metadata
models:
  realismIllustriousBy_v55FP16:
    sd_version: "1.5"
    default_width: 768
    default_height: 1024
    # Merge of Illustrious + realism LoRAs. Strong photorealism, portrait-focused.
    # Key triggers: RAW photo, natural skin texture, realistic eyes
    clip_skip: 2
  v1-5-pruned-emaonly:
    sd_version: "1.5"
    default_width: 512
    default_height: 512
    # SD 1.5 base model. Best for illustration/concept art with artstation-style prompts.
    clip_skip: 1
  anything-v5:
    sd_version: "1.5"
    default_width: 512
    default_height: 768
    # Anime-focused merge. Used with animeoutlineV4_16 LoRA for manga/lineart style.
    # LoRA trigger: lineart, monochrome
    clip_skip: 2
  Juggernaut-XL_v9_RunDiffusionPhoto_v2:
    sd_version: "XL"
    default_width: 1024
    default_height: 1024
    # SDXL photorealism model. Quality baked in — use descriptive prompts, weighted negatives.
    clip_skip: 1
  chilloutmix_NiPrunedFp32Fix:
    sd_version: "1.5"
    default_width: 512
    default_height: 768
    # Realistic portrait model, strong Asian face aesthetics. Sweet spot: 24-28 steps, CFG 5-7.
    # Key triggers: natural skin texture, golden hour lighting, bokeh
    clip_skip: 2
